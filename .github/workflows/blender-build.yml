name: Build X01 Blender environment
on:
  push:
    branches: ["main"]
    paths:
      - "data/x01-map-data.json"
      - "tools/build_x01_blender.py"
      - ".github/workflows/blender-build.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "blender-build"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --background --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"
      - name: Build X01 3D environment
        run: |
          mkdir -p assets
          blender --background --factory-startup --python tools/build_x01_blender.py -- --input data/x01-map-data.json --output assets/x01-reconstruction.glb --blend assets/x01-reconstruction.blend
      - name: Publish GLB to the website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s assets/x01-reconstruction.glb
          git add assets/x01-reconstruction.glb
          if git diff --cached --quiet; then
            echo "No GLB changes to commit"
          else
            git commit -m "Publish rebuilt X01 Blender environment"
            git push
          fi
      - name: Publish generated environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: x01-blender-glb
          path: |
            assets/x01-reconstruction.glb
            assets/x01-reconstruction.blend
          if-no-files-found: error
