.station small{color:#a5b19e;font-size:8px;font-weight:600}

let mode='orbit',yaw=Math.PI,pitch=-.12,orbitYaw=.7,orbitPitch=.52,orbitDistance=76,playerYaw=0,move={forward:false,back:false,left:false,right:false},dragging=false,lastX=0,lastY=0,activeStation=null,showLabels=true;
const target=new THREE.Vector3(0,1,0);const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
function setMode(m){mode=m;player.visible=m==='third';for(const id of ['orbit','first','third'])$('#'+id).classList.toggle('active',id===(m==='orbit'?'orbit':m==='first'?'first':'third'));$('#status').textContent=m==='orbit'?'ORBIT VIEW · DRAG TO ROTATE · WHEEL TO ZOOM':m==='first'?'FIRST PERSON · WASD TO MOVE · E TO INTERACT':'THIRD PERSON · WASD TO MOVE · E TO INTERACT';}
function chooseStation(s){activeStation=s;$('#prompt').innerHTML='<strong>INTERACT · '+s.name.toUpperCase()+'</strong><div>'+s.unlock+' · Press E / tap to inspect</div>';const p=$('#prompt');p.style.display='block';}
function openStation(s){$('#modalTitle').textContent=s.name;$('#modalText').textContent=s.desc+' Unlock status: '+s.unlock+'. This is an interactive reconstruction panel; game account functions are not connected.';$('#closePanel').classList.add('open')}
function nearest(){let best=null,bd=9;for(const s of stations){const d=Math.hypot(player.position.x-s.pos[0],player.position.z-s.pos[2]);if(d<bd){best=s;bd=d}}return best}
function updateCamera(){if(mode==='orbit'){const cp=Math.cos(orbitPitch);camera.position.set(target.x+Math.sin(orbitYaw)*cp*orbitDistance,target.y+Math.sin(orbitPitch)*orbitDistance,target.z+Math.cos(orbitYaw)*cp*orbitDistance);camera.lookAt(target)}else{const eye=new THREE.Vector3(player.position.x,mode==='first'?1.72:4.4,player.position.z);if(mode==='first'){camera.position.copy(eye);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0)}else{const back=new THREE.Vector3(Math.sin(playerYaw),0,Math.cos(playerYaw)).multiplyScalar(7);camera.position.set(eye.x+back.x,eye.y+1.2,eye.z+back.z);camera.lookAt(player.position.x,1.6,player.position.z)}}}
function movePlayer(dt){const speed=mode==='first'?7:6;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));if(mode==='third')forward.set(-Math.sin(playerYaw),0,-Math.cos(playerYaw));const right=new THREE.Vector3(forward.z,0,-forward.x);let v=new THREE.Vector3();if(move.forward||keys.KeyW||keys.ArrowUp)v.add(forward);if(move.back||keys.KeyS||keys.ArrowDown)v.sub(forward);if(move.right||keys.KeyD||keys.ArrowRight)v.add(right);if(move.left||keys.KeyA||keys.ArrowLeft)v.sub(right);if(v.lengthSq()){v.normalize().multiplyScalar(speed*dt);player.position.add(v);player.position.x=THREE.MathUtils.clamp(player.position.x,-49,49);player.position.z=THREE.MathUtils.clamp(player.position.z,-49,49);if(mode==='third')playerYaw=Math.atan2(-v.x,-v.z);player.visible=mode==='third'}else player.visible=mode==='third';}
function updateStationUI(){const list=$('#stations');list.innerHTML='';for(const s of stations){const b=document.createElement('button');b.className='station';b.innerHTML='<span>'+s.name+'</span><small>'+s.unlock+'</small>';b.addEventListener('click',()=>{setMode('orbit');target.set(s.pos[0],1,s.pos[2]);orbitDistance=17;updateCamera();openStation(s)});list.appendChild(b)}}
updateStationUI();setMode('orbit');updateCamera();
$('#orbit').onclick=()=>setMode('orbit');$('#first').onclick=()=>{setMode('first');player.visible=false;player.position.set(0,0,27);yaw=Math.PI;pitch=-.08;updateCamera()};$('#third').onclick=()=>{setMode('third');player.position.set(0,0,27);playerYaw=0;updateCamera()};$('#reset').onclick=()=>{target.set(0,1,0);orbitYaw=.7;orbitPitch=.52;orbitDistance=76;player.position.set(0,0,27);setMode('orbit');updateCamera()};$('#labels').onclick=e=>{showLabels=!showLabels;e.currentTarget.classList.toggle('active',showLabels);for(const s of stationObjects){s.beacon.visible=showLabels;s.ring.visible=showLabels}};
$('#dismiss').onclick=()=>$('#closePanel').classList.remove('open');
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&mode!=='orbit'){const s=nearest();if(s)openStation(s)}if(e.code==='Escape')$('#closePanel').classList.remove('open')});window.addEventListener('keyup',e=>keys[e.code]=false);
for(const b of document.querySelectorAll('#touchpad button')){const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();move[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>move[k]=false))}
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);if(mode==='orbit'){const rect=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-rect.left)/rect.width*2-1;mouse.y=-(e.clientY-rect.top)/rect.height*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(stationObjects.map(s=>s.object),true);if(hits.length){const hit=stationObjects.find(s=>s.object===hits[0].object||s.object.getObjectByProperty('uuid',hits[0].object.uuid));if(hit)openStation(hit.data)}}});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(mode==='orbit'){orbitYaw-=dx*.006;orbitPitch=THREE.MathUtils.clamp(orbitPitch+dy*.005,-.05,1.35)}else{yaw-=dx*.004;pitch=THREE.MathUtils.clamp(pitch-dy*.004,-1.2,1.2);if(mode==='third')playerYaw=yaw} });
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{if(mode==='orbit')orbitDistance=THREE.MathUtils.clamp(orbitDistance+e.deltaY*.045,12,130);else camera.fov=THREE.MathUtils.clamp(camera.fov+e.deltaY*.025,40,85);camera.updateProjectionMatrix()},{passive:true});
let previous=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-previous)/1000,.04);previous=now;if(mode!=='orbit')movePlayer(dt);updateCamera();const near=mode==='orbit'?null:nearest();if(near&&near!==activeStation)chooseStation(near);else if(!near&&mode!=='orbit'&&activeStation){activeStation=null;$('#prompt').innerHTML='<strong>FOB FIELD GUIDE</strong><div>Move closer to a station and press E to inspect</div>'}for(const s of stationObjects){s.beacon.position.y=5.6+Math.sin(now*.002+s.data.pos[0])*.12;s.ring.rotation.z=now*.00025}renderer.render(scene,camera)}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('#status').textContent='FOB SCENE READY · REFERENCE-LED BLOCKOUT · NOT YET A MEASURED 1:1 LAYOUT';
</script>
</body></html>
